# Publishes a GitHub release when the manifest version changes on master.
# Runs only after the Test workflow passes, and only if the tag is new, so a
# push that doesn't bump the version is a no-op.
name: "Release"

on:
  workflow_run:
    workflows: ["Test"]
    types: [completed]
    branches: [master]

permissions:
  contents: write

jobs:
  release:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Create release for a new manifest version
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          version=$(jq -r .version custom_components/everscent/manifest.json)
          tag="v${version}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; nothing to do."
            exit 0
          fi
          gh release create "$tag" --target "$SHA" --title "$tag" --generate-notes
