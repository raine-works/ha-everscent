# Keeps one pull request open with the next release (`Release v<version>`), its version worked out from what's been
# merged since the last: merging it is the release, published by the repository's own release workflow. The workflow
# is Raineworks', in raine-works/agents (.github/workflows/release-pr.yml): this file only calls it, and comes from the
# raineworks-base skill's templates/workflows/release-pr.yml. Change the workflow there, for every repository at once;
# here, only its inputs (with:). The Base rules check moves the pin when the shared workflows change.
name: Release pull request

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-pr:
    name: Release pull request
    uses: raine-works/agents/.github/workflows/release-pr.yml@8ef4df2732bff8e05f06fd3c99a6d0f9da572f1c # raine-works/agents master
    secrets: inherit
    # The defaults are a Home Assistant integration's: its manifest's version, and a change to custom_components/
    # (not its tests) ships.
    # with:
    #   version-files: |
    #     custom_components/*/manifest.json
    #   paths: ^(custom_components|packages)/
    #   ignore: (^|/)(tests?|__tests__)/|\.test\.
