# Validates the integration against Home Assistant (hassfest) and Home Assistant Marketplace rules.
name: "Validate"

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly too: the Marketplace check reads the repository's GitHub settings (description, topics, releases),
    # which change outside git. Both validators are pinned, so new rules arrive only by bumping their digests.
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Hassfest
        # home-assistant/actions/hassfest only runs this image (untagged, so latest): pin the image itself, and move
        # the digest on with Home Assistant's releases
        uses: docker://ghcr.io/home-assistant/hassfest@sha256:b200bb178c5c62f984c2c705c820bd991e5308d6cba6987d24c7d643919ab5cc # latest, 2026-11-23
  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Marketplace validation
        # hacs/action's action.yml only runs this image (as ghcr.io/hacs/action:main), so pin the image itself
        uses: docker://ghcr.io/hacs/action@sha256:187499a09c5d41f9f0d42ff80d203ed87b974c028290140913b61e005fb0aab2 # main, 2026-11-23
        with:
          category: integration
          github_token: ${{ github.token }}
