# Validates the integration against Home Assistant (hassfest) and HACS rules.
name: "Validate"

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  schedule:
    # Catch upstream hassfest/HACS rule changes weekly.
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Hassfest
        uses: home-assistant/actions/hassfest@86d4564712fa02543c808e3a693dd04f9d3f8361 # master
  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: HACS validation
        uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # main
        with:
          category: integration
          # EverScent is not in the home-assistant/brands repo (custom
          # integration), so skip the brands check.
          ignore: brands
